[package]
name = "vimini"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vmn"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
ropey = "1.6"
anyhow = "1"
tiny_http = "0.12"
notify = "6"
portable-pty = "0.8"
tui-term = "0.2"
vt100 = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
